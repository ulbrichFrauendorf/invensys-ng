<div class="dialog-actions">
  @if (showCancel) {
    <i-button [text]="true" severity="secondary" (clicked)="onCancel()">{{
      cancelLabel
    }}</i-button>
  }
  @if (showSubmit) {
    <i-button
      [outlined]="submitOutlined"
      [severity]="severity"
      [disabled]="submitDisabled || submitLoading"
      [loading]="submitLoading"
      type="submit"
      (clicked)="onSubmit()"
      >{{ submitLabel }}</i-button
    >
  }
</div>
