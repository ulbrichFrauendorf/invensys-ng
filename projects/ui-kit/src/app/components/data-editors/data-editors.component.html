<app-demo-playground
  [showLoadingControl]="true"
  [(loading)]="loading"
  class="data-editors-demo"
  title="Data Editors"
  eyebrow="Form Controls"
>
  <ng-template
    appDemoOption="option-1"
    label="Field picker"
    [selected]="true"
    [sourceCode]="codeExamples.fieldPicker"
  >
    <div class="editor-intro">
      <h3>Fields</h3>
      <i-toggle label="Read-only examples" [(ngModel)]="readonly" />
    </div>
    <i-field-picker
      [loading]="loading()"
      [options]="fields"
      [(ngModel)]="selected"
      [readonly]="readonly"
    />
  </ng-template>

  <ng-template
    appDemoOption="option-2"
    label="Column order"
    [sourceCode]="codeExamples.orderedList"
  >
    <div class="editor-intro">
      <h3>Columns</h3>
    </div>
    <i-ordered-list
      [loading]="loading()"
      [(items)]="selected"
      [itemLabel]="label"
      [readonly]="readonly"
      [itemTemplate]="settings"
    />
    <ng-template #settings let-key
      ><small>{{ label(key) }} settings</small></ng-template
    >
  </ng-template>

  <ng-template appDemoOption="option-3" label="Filter rules" [sourceCode]="codeExamples.filters">
    <div class="editor-intro">
      <h3>Filters</h3>
    </div>
    <i-rule-editor
      [loading]="loading()"
      [fields]="ruleFields"
      [operators]="operators"
      [(rules)]="rules"
      [readonly]="readonly"
    />
  </ng-template>

  <ng-template appDemoOption="option-4" label="Sort rules" [sourceCode]="codeExamples.sorts">
    <div class="editor-intro">
      <h3>Sort order</h3>
    </div>
    <i-rule-editor
      [loading]="loading()"
      ariaLabel="Sort order"
      operatorLabel="Direction"
      addLabel="Add sort"
      [fields]="ruleFields"
      [operators]="directions"
      [(rules)]="sorts"
      [readonly]="readonly"
    />
  </ng-template>
  <ng-template appDemoUsage>
    <p>Drag items or use the arrow buttons to reorder them. Sort rules apply from top to bottom.</p>
  </ng-template>
</app-demo-playground>
