<div
  class="i-listbox-wrapper"
  [class.i-listbox--fluid]="fluid"
  [class.i-listbox--disabled]="disabled"
  [class.i-listbox--invalid]="showErrors"
  [class.i-listbox--menu]="displayAsMenu"
  #dropdown
>
  <!-- Header -->
  <div class="i-listbox-header">
    <div class="i-listbox-header-content">
      <span class="i-listbox-title">{{ effectiveTitle }}</span>
      @if (actionIcon) {
        <i-button
          [text]="true"
          [size]="'small'"
          [severity]="'contrast'"
          [icon]="actionIcon"
          [disabled]="disabled"
          (clicked)="onActionClick($event)"
          [attr.title]="actionTooltip"
        ></i-button>
      }
    </div>

    <!-- Chips area for multiselect mode -->
    @if (multiple && showChips) {
      <div class="i-listbox-chips-wrapper">
        <i-chips
          class="i-listbox-chips"
          [chips]="getSelectedChipItems()"
          [removable]="!disabled"
          [disabled]="disabled"
          [collapseOnOverflow]="true"
          [overflowLabel]="getDisplayLabel()"
          (removeChip)="onChipRemove($event)"
        ></i-chips>
      </div>
    }
  </div>

  <!-- Dropdown content -->
  <div class="i-listbox-dropdown">
    @if (filter) {
      <div class="i-listbox-filter">
        <i-input-text
          #searchInput
          [useFloatLabel]="false"
          [label]="'Search ' + title"
          placeholder="Search…"
          [ngModel]="filterValue()"
          (ngModelChange)="filterValue.set($event)"
          [fluid]="true"
          [icon]="'pi pi-search'"
        >
        </i-input-text>
      </div>
    }

    <div class="i-listbox-options">
      @for (option of filteredOptions(); track getOptionValue(option)) {
        <button
          type="button"
          [disabled]="disabled"
          class="i-listbox-option"
          [attr.aria-pressed]="isOptionSelected(option)"
          [class.selected]="isOptionSelected(option)"
          [class.has-icon]="!multiple && getOptionIcon(option)"
          (click)="toggleOption(option)"
        >
          <!-- Checkbox only in multiple mode -->
          @if (multiple) {
            <span
              aria-hidden="true"
              class="pi i-listbox-checkbox"
              [class.pi-check-square]="isOptionSelected(option)"
              [class.pi-stop]="!isOptionSelected(option)"
            ></span>
          }

          <!-- Left icon -->
          @if (getOptionIcon(option) && !displayAsMenu) {
            <i
              [class]="getOptionIcon(option)"
              class="i-listbox-option-icon i-listbox-option-icon--left"
            ></i>
          }

          <span class="i-listbox-option-label">
            {{ getOptionLabel(option) }}
          </span>

          <!-- Right chevron for menu mode -->
          @if (displayAsMenu) {
            <i class="pi pi-chevron-right i-listbox-option-icon i-listbox-option-icon--chevron"></i>
          }
        </button>
      }
      @if (filteredOptions().length === 0) {
        <div class="i-listbox-no-options">No options found</div>
      }
    </div>
  </div>

  <!-- Error message -->
  @if (showErrors) {
    <div class="i-listbox-error">
      {{ getErrorMessage() }}
    </div>
  }
</div>
