<div
  class="i-stepper"
  [ngClass]="'i-stepper-' + orientation"
  [attr.id]="componentId"
>
  <div class="i-stepper-body">
    <i-carousel
      class="i-stepper-navigation"
      [mobileOnly]="true"
      [activeIndex]="activeIndex"
      [ariaLabel]="ariaLabel"
      role="list"
    >
      @for (step of steps; track step; let index = $index; let last = $last) {
        <div
          role="listitem"
          iCarouselItem
          class="i-stepper-item"
          [class.i-stepper-item-active]="activeIndex === index"
          [class.i-stepper-item-completed]="step.completed"
          [class.i-stepper-item-disabled]="!canSelect(index)"
        >
          <button
            class="i-stepper-trigger"
            type="button"
            [attr.id]="componentId + '-step-' + index"
            [attr.aria-current]="activeIndex === index ? 'step' : null"
            [attr.aria-controls]="componentId + '-panel-' + index"
            [attr.aria-describedby]="
              step.description ? componentId + '-description-' + index : null
            "
            [attr.tabindex]="activeIndex === index ? 0 : -1"
            [disabled]="!canSelect(index)"
            (click)="selectStep($event, index)"
            (keydown)="onKeyDown($event, index)"
          >
            <span class="i-stepper-sr-only"
              >Step {{ index + 1 }} of {{ steps.length }}.</span
            >
            <span class="i-stepper-indicator" aria-hidden="true">
              @if (step.icon) {
                <i [ngClass]="step.icon"></i>
              } @else {
                {{ index + 1 }}
              }
            </span>
            <span class="i-stepper-copy">
              <span class="i-stepper-label">{{ step.label }}</span>
              @if (step.description) {
                <span
                  class="i-stepper-description"
                  [attr.id]="componentId + '-description-' + index"
                  >{{ step.description }}</span
                >
              }
            </span>
            @if (step.optional && !step.completed) {
              <span class="i-stepper-optional">Optional</span>
            }
            @if (step.completed) {
              <span class="i-stepper-completion"
                ><i class="pi pi-check" aria-hidden="true"></i
                ><span class="i-stepper-sr-only">Completed.</span></span
              >
            } @else if (!last) {
              <i
                class="pi pi-chevron-right i-stepper-chevron"
                aria-hidden="true"
              ></i>
            }
          </button>
          @if (!last) {
            <span class="i-stepper-connector" aria-hidden="true"></span>
          }
        </div>
      }
    </i-carousel>
    @for (step of steps; track step; let index = $index) {
      <section
        class="i-stepper-panel"
        [class.i-stepper-panel-active]="activeIndex === index"
        [attr.id]="componentId + '-panel-' + index"
        [attr.aria-labelledby]="componentId + '-step-' + index"
        [attr.hidden]="activeIndex !== index || null"
        role="region"
      >
        @if (activeIndex === index) {
          <ng-container [ngTemplateOutlet]="step.contentTemplate" />
        }
      </section>
    }
  </div>
  <div class="i-stepper-actions"><ng-content select="[stepperActions]" /></div>
</div>
