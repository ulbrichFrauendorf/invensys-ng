<div class="i-stepper" [ngClass]="'i-stepper--' + orientation" [attr.id]="componentId">
  <div class="i-stepper__body">
  <ol class="i-stepper__navigation" [attr.aria-label]="ariaLabel">
    @for (step of steps; track step; let index = $index; let last = $last) {
      <li class="i-stepper__item"
        [class.i-stepper__item--active]="activeIndex === index"
        [class.i-stepper__item--completed]="step.completed"
        [class.i-stepper__item--disabled]="!canSelect(index)">
        <button class="i-stepper__trigger" type="button"
          [attr.id]="componentId + '-step-' + index"
          [attr.aria-current]="activeIndex === index ? 'step' : null"
          [attr.aria-controls]="componentId + '-panel-' + index"
          [attr.aria-describedby]="step.description ? componentId + '-description-' + index : null"
          [attr.tabindex]="activeIndex === index ? 0 : -1"
          [disabled]="!canSelect(index)"
          (click)="selectStep($event, index)"
          (keydown)="onKeyDown($event, index)">
          <span class="i-stepper__sr-only">Step {{ index + 1 }} of {{ steps.length }}.</span>
          <span class="i-stepper__indicator" aria-hidden="true">
            @if (step.icon) { <i [ngClass]="step.icon"></i> }
            @else { {{ index + 1 }} }
          </span>
          <span class="i-stepper__copy">
            <span class="i-stepper__label">{{ step.label }}</span>
            @if (step.description) {
              <span class="i-stepper__description" [attr.id]="componentId + '-description-' + index">{{ step.description }}</span>
            }
          </span>
          @if (step.optional && !step.completed) { <span class="i-stepper__optional">Optional</span> }
          @if (step.completed) {
            <span class="i-stepper__completion"><i class="pi pi-check" aria-hidden="true"></i><span class="i-stepper__sr-only">Completed.</span></span>
          } @else if (!last) {
            <i class="pi pi-chevron-right i-stepper__chevron" aria-hidden="true"></i>
          }
        </button>
        @if (!last) { <span class="i-stepper__connector" aria-hidden="true"></span> }
      </li>
    }
  </ol>
  @for (step of steps; track step; let index = $index) {
    <section class="i-stepper__panel"
      [class.i-stepper__panel--active]="activeIndex === index"
      [attr.id]="componentId + '-panel-' + index"
      [attr.aria-labelledby]="componentId + '-step-' + index"
      [attr.hidden]="activeIndex !== index || null" role="region">
      @if (activeIndex === index) { <ng-container [ngTemplateOutlet]="step.contentTemplate" /> }
    </section>
  }
  </div>
  <div class="i-stepper__actions"><ng-content select="[stepperActions]" /></div>
</div>
