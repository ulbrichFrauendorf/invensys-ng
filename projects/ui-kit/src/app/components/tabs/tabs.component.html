<app-demo-playground class="tabs-demo" title="Tabs" eyebrow="Layout &amp; Containers">
  <ng-template
    appDemoOption="option-1"
    label="Text Only Tabs"
    [selected]="true"
    [sourceCode]="codeExamples.textOnly"
    [tsCode]="tsExamples.basic"
  >
    <div class="tab-examples">
      <i-tabs [(activeIndex)]="textOnlyActiveIndex">
        <i-tab-panel header="Home">
          <div class="tab-content">
            <h3>Home</h3>
          </div>
        </i-tab-panel>
        <i-tab-panel header="Profile">
          <div class="tab-content">
            <h3>Profile</h3>
          </div>
        </i-tab-panel>
        <i-tab-panel header="Settings">
          <div class="tab-content">
            <h3>Settings</h3>
          </div>
        </i-tab-panel>
      </i-tabs>
    </div>
  </ng-template>

  <ng-template appDemoOption="option-2" label="Icon Only Tabs" [sourceCode]="codeExamples.iconOnly">
    <div class="tab-examples">
      <i-tabs [(activeIndex)]="iconOnlyActiveIndex">
        <i-tab-panel icon="pi pi-home">
          <div class="tab-content">
            <h3>Home</h3>
          </div>
        </i-tab-panel>
        <i-tab-panel icon="pi pi-user">
          <div class="tab-content">
            <h3>User</h3>
          </div>
        </i-tab-panel>
        <i-tab-panel icon="pi pi-cog">
          <div class="tab-content">
            <h3>Settings</h3>
          </div>
        </i-tab-panel>
      </i-tabs>
    </div>
  </ng-template>

  <ng-template
    appDemoOption="option-3"
    label="Icon and Text Tabs"
    [sourceCode]="codeExamples.iconText"
  >
    <div class="tab-examples">
      <i-tabs [(activeIndex)]="iconTextActiveIndex">
        <i-tab-panel header="Home" icon="pi pi-home">
          <div class="tab-content">
            <h3>Home</h3>
          </div>
        </i-tab-panel>
        <i-tab-panel header="Profile" icon="pi pi-user">
          <div class="tab-content">
            <h3>Profile</h3>
          </div>
        </i-tab-panel>
        <i-tab-panel header="Settings" icon="pi pi-cog">
          <div class="tab-content">
            <h3>Settings</h3>
          </div>
        </i-tab-panel>
      </i-tabs>
    </div>
  </ng-template>

  <ng-template appDemoOption="option-4" label="Disabled Tabs" [sourceCode]="codeExamples.disabled">
    <div class="tab-examples">
      <i-tabs [(activeIndex)]="disabledActiveIndex">
        <i-tab-panel header="Active" icon="pi pi-check">
          <div class="tab-content">
            <h3>Active Tab</h3>
          </div>
        </i-tab-panel>
        <i-tab-panel header="Disabled" icon="pi pi-ban" [disabled]="true">
          <div class="tab-content">
            <h3>Disabled Tab</h3>
          </div>
        </i-tab-panel>
        <i-tab-panel header="Another" icon="pi pi-star">
          <div class="tab-content">
            <h3>Another Tab</h3>
          </div>
        </i-tab-panel>
      </i-tabs>
    </div>
  </ng-template>

  <ng-template
    appDemoOption="option-5"
    label="Closable Tabs"
    [sourceCode]="codeExamples.closable"
    [tsCode]="tsExamples.closable"
  >
    <div class="tab-examples">
      @if (closableTabs.length > 0) {
        <i-tabs [(activeIndex)]="closableActiveIndex" (onClose)="onTabClose($event)">
          @for (tab of closableTabs; track $index) {
            <i-tab-panel [header]="tab.header" [icon]="tab.icon" [closable]="true">
              <div class="tab-content">
                <h3>{{ tab.header }}</h3>
              </div>
            </i-tab-panel>
          }
        </i-tabs>
      } @else {
        <div class="empty-state">
          <i class="pi pi-inbox" aria-hidden="true"></i>
          <p>All tabs have been closed. Refresh to reset.</p>
        </div>
      }
    </div>
  </ng-template>
</app-demo-playground>
