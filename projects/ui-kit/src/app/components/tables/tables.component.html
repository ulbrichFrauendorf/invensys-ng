<app-demo-playground
  [showLoadingControl]="true"
  [(loading)]="loading"
  class="tables-demo"
  title="Tables"
  eyebrow="Data Display"
  description='Expand a category to view its detail rows. Use [detailRowBorders]="false" to hide their bottom borders and condense their height.'
>
  <ng-template
    appDemoOption="option-1"
    label="Sorting &amp; Filtering"
    [selected]="true"
    [sourceCode]="codeExamples.flat"
    [tsCode]="tsCodeExamples.flat"
  >
    <label>
      <input
        type="checkbox"
        [checked]="showBorder"
        (change)="showBorder = $any($event.target).checked"
      />
      Show outer border and rounded corners
    </label>
    <i-table
      [loading]="loading()"
      [grid]="flatGrid"
      [showBorder]="showBorder"
      [sortable]="true"
      [filterable]="true"
      [globalFilter]="true"
      [height]="'22.5rem'"
      [striped]="true"
      (onSort)="onSort($event)"
      (onFilter)="onFilter($event)"
    ></i-table>
  </ng-template>

  <ng-template
    appDemoOption="option-2"
    label="Selection &amp; Row Actions"
    [sourceCode]="codeExamples.actions"
    [tsCode]="tsCodeExamples.actions"
  >
    <i-table
      [loading]="loading()"
      [grid]="actionsGrid"
      selectionMode="multiple"
      dataKey="id"
      [(selection)]="selectedProducts"
      [hoverable]="true"
      [height]="'22.5rem'"
      (onSelectionChange)="onSelectionChange($event)"
    ></i-table>
  </ng-template>

  <ng-template
    appDemoOption="option-3"
    label="Expandable Detail Sub-Table"
    [sourceCode]="codeExamples.detail"
    [tsCode]="tsCodeExamples.detail"
  >
    <p>
      Expand a category to view its detail rows. Use
      <code>[detailRowBorders]="false"</code> to hide their bottom borders and
      condense their height for easier viewing on mobile.
    </p>
    <label>
      <input
        type="checkbox"
        [checked]="showDetailRowBorders"
        (change)="showDetailRowBorders = $any($event.target).checked"
      />
      Show detail row borders
    </label>
    <i-table
      [loading]="loading()"
      [grid]="detailGrid"
      [sortable]="true"
      [striped]="true"
      [detailRowBorders]="showDetailRowBorders"
    ></i-table>
  </ng-template>

  <ng-template
    appDemoOption="option-4"
    label="Icon &amp; Chip Columns"
    [sourceCode]="codeExamples.icons"
    [tsCode]="tsCodeExamples.icons"
  >
    <i-table
      [loading]="loading()"
      [grid]="iconGrid"
      [sortable]="true"
      [height]="'22.5rem'"
      [hoverable]="true"
    ></i-table>
  </ng-template>

  <ng-template
    appDemoOption="option-5"
    label="Large Dataset — Virtual Scroll &amp; Download"
    [sourceCode]="codeExamples.large"
    [tsCode]="tsCodeExamples.large"
  >
    <i-table
      [loading]="loading()"
      [grid]="largeGrid"
      [sortable]="true"
      [globalFilter]="true"
      [downloadable]="true"
      [virtualScroll]="true"
      downloadFormat="csv"
      [height]="'25rem'"
      (onDownload)="onDownload($event)"
    ></i-table>
  </ng-template>
  <ng-template appDemoOption="sizes" label="Sizes">
    <i-table [grid]="flatGrid" size="small" />
    <i-table [grid]="flatGrid" size="medium" />
    <i-table [grid]="flatGrid" size="large" />
  </ng-template>
  <ng-template appDemoOption="single-selection" label="Single selection">
    <i-table
      [grid]="flatGrid"
      selectionMode="single"
      dataKey="id"
      [(selection)]="selectedProducts"
    />
  </ng-template>
  <ng-template appDemoOption="export-formats" label="Export formats">
    <i-table
      [grid]="flatGrid"
      [downloadable]="true"
      downloadMode="direct"
      downloadFormat="csv"
    />
    <i-table
      [grid]="flatGrid"
      [downloadable]="true"
      downloadMode="direct"
      downloadFormat="excel"
    />
    <i-table
      [grid]="flatGrid"
      [downloadable]="true"
      downloadMode="direct"
      downloadFormat="json"
    />
    <i-table
      [grid]="flatGrid"
      [downloadable]="true"
      downloadMode="api"
      (onDownload)="onDownload($event)"
    />
  </ng-template>
</app-demo-playground>
