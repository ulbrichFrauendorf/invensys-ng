<div class="i-field-picker" role="group" [attr.aria-label]="ariaLabel">
  <i-input-text [label]="searchLabel" icon="pi pi-search" [fluid]="true" [disabled]="disabled"
    [ngModel]="search" (ngModelChange)="search = $event ?? ''" [ngModelOptions]="{ standalone: true }" />
  <div class="i-field-picker__catalog">
    @for (group of groups; track group.name; let groupIndex = $index) {
      <section [attr.aria-labelledby]="componentId + '-group-' + groupIndex">
        <header class="i-field-picker__group-header">
          <h3 [id]="componentId + '-group-' + groupIndex">{{ group.name }}</h3>
          <span>{{ group.options.length }}</span>
        </header>
        @for (option of group.options; track option.key) {
          <div class="i-field-picker__option">
            <i-checkbox [label]="option.label" [checked]="value.includes(option.key)" [readonly]="readonly"
              [disabled]="disabled || !!option.disabled" (onChange)="select(option, $event)" />
            @if (option.description) { <small>{{ option.description }}</small> }
          </div>
        }
      </section>
    } @empty { <i-no-content [message]="emptyMessage" /> }
  </div>
</div>
